---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openserverless-qdrant
  labels:
    helm.sh/chart: qdrant-0.9.2
    app: qdrant
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: openserverless-qdrant
    app.kubernetes.io/version: "v1.9.5"
    app.kubernetes.io/managed-by: Helm
data:
  initialize.sh: |
    #!/bin/sh
    SET_INDEX=${HOSTNAME##*-}
    echo "Starting initializing for pod $SET_INDEX"
    if [ "$SET_INDEX" = "0" ]; then
      exec ./entrypoint.sh --uri 'http://openserverless-qdrant-0.openserverless-qdrant-headless:6335'
    else
      exec ./entrypoint.sh --bootstrap 'http://openserverless-qdrant-0.openserverless-qdrant-headless:6335' --uri 'http://openserverless-qdrant-'"$SET_INDEX"'.openserverless-qdrant-headless:6335'
    fi
    
  production.yaml: |
    cluster:
      consensus:
        tick_period_ms: 100
      enabled: true
      p2p:
        port: 6335