apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: openserverless-prometheus
    meta.helm.sh/release-namespace: openserverless
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: openserverless-prometheus
    app.kubernetes.io/name: prometheus
  name: openserverless-prometheus-server
  namespace: openserverless
data:
  alerting_rules.yml: |
    # Alerting rules
    #
    # Required labels:
    #   alertname
    #   severity    (critical, warning, information)
    #   service     (prometheus, okd, rabbit, redis, kafka, application)
    #   scope       (monitoring, infrastructure, messaging, db)
    # Optional Labels:
    #   target      (downstream)
    #   environment (stage, production)

    groups:
    - name: Nodes 
      rules: 
      - alert: High Node Memory Usage 
        expr: | 
          (sum (container_memory_working_set_bytes{id="/",container!="POD"}) by (instance) / sum (machine_memory_bytes{}) by (instance) * 100) > 90 
        for: 5m 
        labels: 
          team: devops
          severity: critical
          service: kubernetes
          scope: infrastructure
        annotations: 
          title: Node {{$labels.instance}} has more than 90% memory used. Plan Capacity 
          description: "\nCluster Name: {{$externalLabels.cluster}}\nNode: {{$labels.instance}}\n"

      - alert: High Node CPU Usage 
        expr: |
          (sum(rate(container_cpu_usage_seconds_total{id="/",container!="POD"}[1m])) by (instance) / sum(machine_cpu_cores) by (instance)  * 100) > 90 
        for: 5m 
        labels: 
          team: devops
          severity: critical
          service: kubernetes
          scope: infrastructure
        annotations: 
          title: Node {{$labels.instance}} has more than 90% allocatable cpu used. Plan Capacity. 
          description: "\nCluster Name: {{$externalLabels.cluster}}\nNode: {{$labels.instance}}\n"

      - alert: High Node Disk Usage 
        expr: | 
            (sum(container_fs_usage_bytes{device=~"^/dev/[sv]d[a-z][1-9]$",id="/",container!="POD"}) by (instance) / 
            sum(container_fs_limit_bytes{container!="POD",device=~"^/dev/[sv]d[a-z][1-9]$",id="/"}) by (instance)) * 100 > 90 
        for: 5m 
        labels: 
          team: devops
          severity: critical
          service: kubernetes
          scope: infrastructure
        annotations: 
          title: Node {{$labels.kubernetes_io_hostname}} has more than 90% disk used. Plan Capacity. 
          description: "\nCluster Name: {{$externalLabels.cluster}}\nNode: {{$labels.kubernetes_io_hostname}}\n"                                                          

    - name: Kafka
      interval: 30s # defaults to global interval
      rules:

      - alert: KafkaPodDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
          service: kafka
          scope: infrastructure
        annotations:
          title: "{{$labels.kubernetes_pod_name}} is down on {{$labels.kubernetes_namespace}}"

      - alert: Kafka Ouf Of Memory
        expr: jvm_memory_bytes_used{job="kafka",area="heap"} / jvm_memory_bytes_max{job="kafka",area="heap"}  * 100  > 90
        for: 5m
        labels:
          severity: warning
          service: kafka
          scope: infrastructure
        annotations:
          title: JVM out of memory
          description: JVM is running out of memory (> 90%)

      - alert: VolumeUsage
        expr: volume_percentage_used > 90
        for: 5m
        labels:
          severity: warning
          service: kafka
          scope: infrastructure
        annotations:
          title: High volume usage {{ $value }}
          description: Volume running out (> 90%)

    - name: Pods
      rules:
      - alert: Container restarted
        annotations:
          title: Container named {{$labels.container}} in {{$labels.pod}} in {{$labels.namespace}} was restarted
          description: "\nCluster Name: {{$externalLabels.cluster}}\nNamespace: {{$labels.namespace}}\nPod name: {{$labels.pod}}\nContainer name: {{$labels.container}}\n" 
        expr: |
          sum(increase(kube_pod_container_status_restarts_total{namespace!="kube-system",pod_template_hash=""}[1m])) by (pod,namespace,container) > 0
        for: 0m
        labels:
          team: dev
          severity: critical
          service: openserverless
          scope: infrastructure

      - alert: High Memory Usage of Container 
        annotations: 
          title: Node {{$labels.instance}} - Container named {{$labels.container}} in {{$labels.pod}} in {{$labels.namespace}} is using more than 90% of Memory Limit
          description: "\nCluster Name: {{$externalLabels.cluster}}\nNamespace: {{$labels.namespace}}\nPod name: {{$labels.pod}}\nContainer name: {{$labels.container}}\n" 
        expr: |
          ((( sum(container_memory_working_set_bytes{image!="",container!="POD", namespace!="kube-system"}) by (instance,namespace,container,pod)  / sum(container_spec_memory_limit_bytes{image!="",container!="POD",namespace!="kube-system"}) by (instance,namespace,container,pod) ) * 100 ) < +Inf ) > 90
        for: 5m
        labels: 
          team: dev
          severity: critical
          service: openserverless
          scope: infrastructure   

      - alert: High CPU Usage of Container 
        annotations: 
          title: Node {{$labels.instance}} - Container named {{$labels.container}} in {{$labels.pod}} in {{$labels.namespace}} is using more than 90% of CPU Limit
          description: "\nCluster Name: {{$externalLabels.cluster}}\nNamespace: {{$labels.namespace}}\nPod name: {{$labels.pod}}\nContainer name: {{$labels.container}}\n" 
        expr: |
          ((sum(irate(container_cpu_usage_seconds_total{image!="",container!="POD", namespace!="kube-system"}[30s])) by (instance,namespace,container,pod) / sum(container_spec_cpu_quota{image!="",container!="POD", namespace!="kube-system"} / container_spec_cpu_period{image!="",container!="POD", namespace!="kube-system"}) by (instance,namespace,container,pod) ) * 100)  > 90
        for: 5m
        labels: 
          team: dev
          severity: critical
          service: openserverless
          scope: infrastructure                                               

      - alert: High Persistent Volume Usage
        annotations:
          title: Node {{$labels.instance}} Persistent Volume Claim {{$labels.persistentvolumeclaim}} has more than 90% allocatable space used. Plan Capacity. 
          description: "\nCluster Name: {{$externalLabels.cluster}}\nNode: {{$labels.instance}}\nNamespace {{$labels.namespace}}"
        expr: |
          ((((sum(kubelet_volume_stats_used_bytes{})  by (instance,namespace,persistentvolumeclaim))  / (sum(kubelet_volume_stats_capacity_bytes{}) by (instance,namespace,persistentvolumeclaim)))*100) < +Inf ) > 90
        for: 5m
        labels:
          team: devops
          severity: critical
          service: openserverless
          scope: infrastructure                                                 

    - name: OpenWhisk
      interval: 30s # defaults to global interval
      rules:

      - alert: Openwhisk Controller Down
        expr: up{job="ow-controller"} == 0
        for: 1m
        labels:
          severity: critical
          service: openwhisk
          scope: infrastructure
        annotations:
          title: "Openwhisk Controller on {{$labels.instance}} is down!"

      # - alert: Openwhisk Invoker Unhealthy
      #  expr: counter_loadbalancer_invokerState_counter_total{state="unhealthy"} > 0
      #  for: 1m
      #  labels:
      #    severity: critical
      #    service: openwhisk
      #    scope: infrastructure
      #  annotations:
      #    title: "Openwhisk Invoker on {{$labels.instance}} is down!"          

    - name: Prometheus
      interval: 30s # defaults to global interval
      rules:
      #- alert: PrometheusJobMissing
      #  expr: absent(up{job="prometheus"})
      #  for: 5m
      #  labels:
      #    severity: critical
      #    service: prometheus
      #    scope: monitoring
      #  annotations:
      #    summary: Prometheus job missing (instance {{ $labels.instance }})
      #    description: A Prometheus job has disappeared

      - alert: PrometheusAllTargetsMissing
        expr: count (up) by (job) == 0
        for: 5m
        labels:
          severity: warning
          service: prometheus
          scope: monitoring
        annotations:
          title: Prometheus all targets missing (instance {{ $labels.instance }})
          description: A Prometheus job does not have living target anymore.

      - alert: PrometheusConfigurationReloadFailure
        expr: prometheus_config_last_reload_successful != 1
        for: 5m
        labels:
          severity: warning
          service: prometheus
          scope: monitoring
        annotations:
          title: Prometheus configuration reload failure (instance {{ $labels.instance }})
          description: Prometheus configuration reload error

  alerts: |
    {}
  allow-snippet-annotations: "false"
  prometheus.yml: |
    global:
      evaluation_interval: 1m
      scrape_interval: 1m
      scrape_timeout: 10s
    rule_files:
    - /etc/config/recording_rules.yml
    - /etc/config/alerting_rules.yml
    - /etc/config/rules
    - /etc/config/alerts
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9999
    - job_name: ow-controller
      static_configs:
      - targets:
        - controller:3233
    - job_name: kafka
      static_configs:
      - targets:
        - kafka:9071
    - job_name: kafka-volume
      static_configs:
      - targets:
        - kafka:9888        
    - job_name: 'kube-state-metrics'
      static_configs:
      - targets: ['openserverless-prometheus-kube-state-metrics.openserverless.svc.cluster.local:8080']        
    - job_name: 'kubelet'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true  # Required with Minikube.
      authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token         
    - job_name: 'cadvisor'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true  # Required with Minikube.
      authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token         
      metrics_path: /metrics/cadvisor
    alerting:
      alertmanagers:
      - scheme: http
        static_configs:
        - targets:
          - "openserverless-prometheus-alertmanager:9093"                                                      
  recording_rules.yml: |
    groups:
    - name: aggregate_container_resources
      rules:
      - record: container_cpu_usage_rate
        expr: sum without (cpu) (rate(container_cpu_usage_seconds_total[5m]))
      - record: container_memory_rss_by_type
        expr: container_memory_rss{id=~"/|/system.slice|/kubepods.slice"} > 0
      - record: apiserver_request_count_rate_by_resources
        expr: sum without (client,instance,contentType) (rate(apiserver_request_count[5m]))
  rules: |
    {}
