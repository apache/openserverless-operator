---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: openserverless-mongodb
  namespace: openserverless
spec:
  members: 1
  type: ReplicaSet
  version: "4.2.6"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: {{mongo_admin_user}}
      db: admin
      passwordSecretRef: # a reference to the secret that will be used to generate the user's password
        name: mongodb-admin-auth
        key: mongodb_admin_psw       
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
      scramCredentialsSecretName: mongodb-admin-scram
    - name: {{mongo_openserverless_user}}
      db: openserverless
      passwordSecretRef: # a reference to the secret that will be used to generate the user's password
        name: mongodb-openserverless-auth
        key: mongodb_openserverless_psw     
      roles:
        - name: readWrite
          db: openserverless
      scramCredentialsSecretName: mongodb-openserverless-scram
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.journalCompressor: zlib
  statefulSet:
    spec:
      template:
        metadata:
          labels:
            name: mongodb
            openserverless.mongodb.flavour: operator
          annotations:
            whisks.openserverless.org/annotate-version: "true"       
        spec:  
          containers:
            - name: mongodb-agent
              readinessProbe:
                failureThreshold: 40
                initialDelaySeconds: 5
                timeout: 30
      volumeClaimTemplates:
      - apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: data-volume
        spec:
          resources:
            requests:
              storage: {{size}}G
